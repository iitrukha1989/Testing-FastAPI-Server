services:
  database:
    image: postgres:15
    container_name: database
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - 5433:5432
    networks:
      - backend

  testredis:
    image: redis:alpine
    container_name: testredis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - backend

  web:
    container_name: web
    env_file: .env
    build:
      context: .
      dockerfile: Dockerfile
    networks:
      - backend
    depends_on:
      - testredis
      - database
    restart: always
    volumes:
      - .:/app
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "10"
    command: gunicorn app.main:app --workers 4 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000

  nginx:
    image: nginx:latest
    networks:
      - backend
    ports:
      - "1335:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web

networks:
  backend:
    driver: bridge

volumes:
  pg_data:
  redis_data:
